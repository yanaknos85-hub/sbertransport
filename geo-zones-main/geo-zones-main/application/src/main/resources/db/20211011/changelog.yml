databaseChangeLog:
    -   changeSet:
            id: "20211011"
            author: medvedev-ad
            dbms: postgresql
            changes:
                -   renameColumn:
                        schemaName: geo_zones
                        tableName: geo_zone
                        oldColumnName: code
                        newColumnName: old_code
                -   addColumn:
                        schemaName: geo_zones
                        tableName: geo_zone
                        columns:
