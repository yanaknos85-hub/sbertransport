                            remarks: Код геозоны
                            constraints:
                              nullable: false
                -   sql:
                      sql: update geo_zones.geo_zone set old_code = code::bigint
                -   dropColumn:
                      schemaName: geo_zones
                      tableName: geo_zone
                      columns:
                        -   column:
                              name: code
                              type: text
                -   renameColumn:
                      schemaName: geo_zones
                      tableName: geo_zone
                      oldColumnName: old_code
                      newColumnName: code