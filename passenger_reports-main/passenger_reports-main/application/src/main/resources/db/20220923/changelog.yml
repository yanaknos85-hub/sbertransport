databaseChangeLog:
    -   changeSet:
            id: "20220923"
            author: medvedev-ad
            changes:
                -   createIndex:
                        schemaName: reports
                        tableName: department
                        indexName: reports_departments_organization_id_idx
                        columns:
                            - column:
                                  name: organization_id
                -   createIndex:
                        schemaName: reports
                        tableName: employee
                        indexName: reports_employee_department_id_idx
                        columns:
                            - column:
                                  name: department_id
                -   createIndex:
                        schemaName: reports
                        tableName: request
                        indexName: reports_request_passenger_id_idx
                        columns:
                            - column:
                                  name: passenger_id
                -   createIndex:
                        schemaName: reports
                        tableName: request
                        indexName: reports_request_creation_time_desc_idx
                        columns:
                            - column:
                                  name: creation_time
                                  descending: true