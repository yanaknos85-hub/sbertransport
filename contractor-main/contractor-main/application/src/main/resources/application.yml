server:
    port: 8004
spring:
    config:
      import:
          - application-import.yml
          - optional:configserver:${spring.cloud.config.uri}
    cloud:
        vault.enabled: false
        openfeign.okhttp.enabled: true
    jackson:
        default-property-inclusion: non_null
    application:
        name: contractor
        version: @project.version@
    datasource:
        driver-class-name: org.postgresql.Driver
        type: com.zaxxer.hikari.HikariDataSource
        hikari:
            maximum-pool-size: ${MAX_POOL_SIZE:3}
            connection-test-query:  SELECT 1
            schema: contractors
    jpa:
        properties:
            '[hypersistence.utils.enable_types_contributor]': false
            hibernate:
                jdbc:
                    batch_size: 25
                    lob:
                        non_contextual_creation: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: none
        show-sql: false
        open-in-view: false
    liquibase:
        enabled: true
        change-log: db/changelog-master.yml
        url: ${spring.datasource.url}
        user: ${spring.datasource.username}
        password: ${spring.datasource.password}
        database-change-log-table: changelog_${spring.application.name}
        database-change-log-lock-table: changelog_${spring.application.name}_lock
        liquibase-schema: ${MIGRATIONS_SCHEMA:public}
    servlet:
        multipart:
            enabled: true
            max-file-size: ${file.max-size}
            max-request-size: ${file.max-size}
file:
    max-size: ${FILE_MAX_SIZE:5MB}
websocket:
    baseUrl: /ws
grpc:
    server.port: 6565
    in-process-server-name: ${spring.application.name}
    client:
        GLOBAL:
            negotiation-type: plaintext
        grpc-tariff-fleet:
            address: discovery:/grpc-tariff-fleet
authorization:
    consent-check: ${CHECK_CONSENT:true}
