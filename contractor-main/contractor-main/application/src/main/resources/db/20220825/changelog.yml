databaseChangeLog:
    -   changeSet:
            id: "20220825"
            context: "20220825"
            author: medvedev-ad
            changes:
                -   createTable:
                        schemaName: contractors
                        tableName: dispatcher
                        remarks: Диспетчеры
                        columns:
                            -   column:
                                    name: id
                                    type: uuid
                                    remarks: Идентификатор
                                    constraints:
                                        primaryKey: true
                                        primaryKeyName: contractors_dispatcher_pk
                            -   column:
                                    name: human_readable_id
                                    type: text
                                    remarks: Человекочитаемый идентификатор
                                    constraints:
                                        nullable: false
                                        unique: true
                                        uniqueConstraintName: contractors_dispatcher_human_readable_id_uk
                            -   column:
                                    name: last_name
                                    type: text
                                    remarks: Фамилия
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: first_name
                                    type: text
                                    remarks: Имя
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: patronymic
                                    type: text
                                    remarks: Отчество
                            -   column:
                                    name: phone
                                    type: text
                                    remarks: Номер телефона
                                    constraints:
                                        nullable: false
                                        uniqueConstraintName: contractors_dispatcher_email_uk
                            -   column:
                                    name: email
                                    type: text
                                    remarks: E-Mail
                                    constraints:
                                        nullable: false
                                        unique: true
                                        uniqueConstraintName: contractors_dispatcher_email_uk
                            -   column:
                                    name: contractor_id
                                    type: uuid
                                    remarks: Контрагент
                                    constraints:
                                        foreignKeyName: contractors_dispatcher_contractor_fk
                                        referencedColumnNames: id
                                        referencedTableName: contractor
                                        referencedTableSchemaName: contractors
                -   createIndex:
                        schemaName: contractors
                        tableName: dispatcher
                        indexName: contractors_dispatcher_contractor_fk_ix
                        columns:
                            -   column:
                                    name: contractor_id
                -   createTable:
                        schemaName: contractors
                        tableName: request
                        remarks: Заявки
                        columns:
                            -   column:
                                    name: id
                                    type: uuid
                                    remarks: Идентификатор
