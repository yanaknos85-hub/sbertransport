databaseChangeLog:
  - changeSet:
      id: "20230314"
      author: blandin-ad
      changes:
          - tagDatabase:
                tag: "20230314"
          - addColumn:
                schemaName: contractors
                tableName: trips
                columns:
                    - column:
                        name: driver_waiting_time
                        type: bigint
                        remarks: Время ожидания пассажира водителем
                    - column:
                        name: fact_distance
                        type: double precision
                        remarks: Фактическая дистанция поездки
      rollback:
          - dropColumn:
                schemaName: contractors
                tableName: trips
                columns:
                    - column:
                        name: driver_waiting_time
                    - column:
                        name: fact_distance