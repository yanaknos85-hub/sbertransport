            remarks: Связь ролей и ограничений
            columns:
              - column:
                  name: restriction_id
                  type: uuid
                  remarks: Идентификатор ограничения
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_restriction_roles_restriction_id_nn
                    foreignKeyName: restrictions_settings_restriction_fk
                    referencedTableSchemaName: ${schema_name}_settings
                    referencedTableName: restrictions
                    referencedColumnNames: id
              - column:
                  name: role_code
                  type: varchar(20)
                  remarks: Код роли
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_restriction_roles_role_code_nn
                    foreignKeyName: restriction_roles_fk
                    referencedTableSchemaName: ${schema_name}_corporate
                    referencedTableName: roles
                    referencedColumnNames: code
              - column:
                  name: id
                  type: uuid
                  remarks: Идентификатор
                  constraints:
                    primaryKey: true
                    primaryKeyName: restriction_roles_pkey
        - addUniqueConstraint:
            schemaName: ${schema_name}_settings
            tableName: restriction_roles
            columnNames: restriction_id, role_code
            constraintName: restrictions_uk
        - createTable:
            schemaName: ${schema_name}_settings
            tableName: send_time
            remarks: Время отправки уведомлений
