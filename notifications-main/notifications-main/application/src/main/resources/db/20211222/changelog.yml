databaseChangeLog:
  - changeSet:
      id: "20211222-1-remastered"
      author: medvedev-ad
      preConditions:
        - not:
            - tableExists:
                schemaName: ${schema_name}
                tableName: notification
          onFail: MARK_RAN
      changes:
        - sql:
            sql: create schema ${schema_name}
        - sql:
            sql: create schema ${schema_name}_approve
        - sql:
            sql: create schema ${schema_name}_contractor
        - sql:
            sql: create schema ${schema_name}_corporate
        - sql:
            sql: create schema ${schema_name}_limits
        - sql:
            sql: create schema ${schema_name}_request
        - sql:
            sql: create schema ${schema_name}_settings
        - createTable:
            schemaName: ${schema_name}_settings
            tableName: notification
            remarks: Настройки уведомлений
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: Идентификатор
                  constraints:
                    primaryKeyName: settings_pkey
                    primaryKey: true
              - column:
                  name: class
                  type: varchar(50)
                  remarks: Тип уведомления (REQUEST_TAXI, REQUEST_PUBLIC, REQUEST_PERSONAL, REQUEST_CAR_SHARING, REQUEST_BICYCLE, REQUEST_SCOOTER, REQUEST_LIMIT_PERSON, REQUEST_LIMIT_DEPARTMENT, LIMIT_DEPARTMENT, LIMIT_PERSON, USER_DELEGATE, USER_OWNER_LIMIT, USER_ASSIGNMENT)
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_notification_class_nn
              - column:
                  name: name
                  type: varchar(255)
                  remarks: Уникальное название уведомления
                  constraints:
                    nullable: false
                    uniqueConstraintName: ${schema_name}_settings_notification_name_uq
              - column:
                  name: description
                  type: varchar(4000)
                  remarks: Описание уведомления
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_description_nnc
              - column:
                  name: parent_id
                  type: uuid
                  remarks: Идентификатор родительского объекта
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_notification_organization_id_nn
              - column:
                  name: owner_id
                  type: uuid
                  remarks: Идентификатор владельца настройки
              - column:
                  name: type
                  type: varchar(30)
                  remarks: Тип уведомления
              - column:
                  name: parent_type
                  type: varchar(20)
                  remarks: Тип родительского объекта
                  defaultOnNull: true
                  defaultValue: ORGANIZATION
                  constraints:
                    nullable: false
                    notNullConstraintName: notifications_settings_settings_parent_type_nn
        - addUniqueConstraint:
            schemaName: ${schema_name}_settings
            tableName: notification
            constraintName: ${schema_name}_settings_uk
            columnNames: description,parent_id
        - addUniqueConstraint:
            schemaName: ${schema_name}_settings
            tableName: notification
            columnNames: parent_id, type, class, owner_id
            constraintName: ${schema_name}_settings_notification_uk
        - createTable:
            schemaName: ${schema_name}_settings
            tableName: channel
            remarks: Каналы уведомлений
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: Идентификатор
                  constraints:
                    primaryKey: true
                    primaryKeyName: ${schema_name}_settings_channel_pk
              - column:
                  name: settings_id
                  type: uuid
                  remarks: Идентификатор настройки
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_channel_settings_id_nn
                    foreignKeyName: settings_channel_settings_fk
                    referencedTableSchemaName: ${schema_name}_settings
                    referencedTableName: notification
                    referencedColumnNames: id
              - column:
                  name: channel
                  type: varchar(20)
                  remarks: Тип канала уведомлений (EMAIL, SMS, PUSH)
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_channel_channel_nn
              - column:
                  name: text
                  type: text
                  remarks: Текст уведомления
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_channel_text_nn
              - column:
                  name: active
                  type: boolean
                  remarks: Флаг активности канала уведомлений
                  defaultOnNull: true
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_channel_active_nn
        - createTable:
            schemaName: ${schema_name}_settings
            tableName: restrictions
            remarks: Ограничения для уведомлений
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: Идентификатор
                  constraints:
                    primaryKey: true
                    primaryKeyName: ${schema_name}_settings_restrictions_pk
              - column:
                  name: restrict_type
                  type: varchar(30)
                  remarks: Тип ограничений (ALLOW_ALL, ALLOW_BUT, DENY_BUT, DENY_ALL)
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_restrictions_restrict_type_nn
              - column:
                  name: settings_id
                  type: uuid
                  remarks: Идентификатор настройки
                  constraints:
                    nullable: false
                    notNullConstraintName: ${schema_name}_settings_restrictions_settings_id_nn
                    foreignKeyName: restrictions_settings_fk
                    referencedTableSchemaName: ${schema_name}_settings
                    referencedTableName: notification
                    referencedColumnNames: id
        - createTable:
            schemaName: ${schema_name}_corporate
            tableName: roles
            remarks: Роли
            columns:
              - column:
                  name: code
                  type: varchar(255)
                  remarks: Код роли
                  constraints:
                    primaryKey: true
                    primaryKeyName: roles_pkey
        - createTable:
            schemaName: ${schema_name}_settings
