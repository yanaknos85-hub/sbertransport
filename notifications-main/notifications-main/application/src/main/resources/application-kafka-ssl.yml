spring.cloud.stream:
  binders:
    kafka-ssl:
      type: kafka
      environment:
        spring.cloud.stream.kafka:
          default:
            consumer:
              enableDlq: true
              autoCommitOnError: true
              topic.properties:
                cleanup.policy: compact,delete
                retention.ms: 604800000
            producer:
              topic.properties:
                cleanup.policy: compact,delete
                retention.ms: 604800000
          binder:
            configuration:
              security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
              ssl:
                endpoint.identification.algorithm: ""
                client.auth: required
                enabled.protocols: TLSv1.2
                truststore:
                  location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
                  password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
                keystore:
                  location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
                  password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
                key.password: ${KAFKA_SSL_KEY_PASSWORD:}
            brokers:
              - ${KAFKA_BROKERS:localhost}
            producerProperties:
              key.serializer: org.springframework.kafka.support.serializer.JsonSerializer
            consumerProperties:
              key.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  bindings:
    emailOutputSsl-out-0:
      destination: service.email.output
      binder: kafka-ssl
    pushOutputSsl-out-0:
      destination: service.push
      binder: kafka-ssl
    tripApproveInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.trip.request.approve
      binder: kafka-ssl
    tripRequestInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.request
      binder: kafka-ssl
    tripInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.trip
      binder: kafka-ssl
    approveLimitsRequestInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.limits.approve.request
      binder: kafka-ssl
    delegateInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.organization.employee.delegate
      binder: kafka-ssl
    tripPurposeInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.organization.trip.purpose
      binder: kafka-ssl
    sharedRideApproveInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.shared.ride.approve
      binder: kafka-ssl
    driverInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.contractor.driver
      binder: kafka-ssl
    vehicleInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.contractor.vehicle
      binder: kafka-ssl
    taxiTripInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.request.taxi.trip
      binder: kafka-ssl
    taxiTariffInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.tariff.taxi
      binder: kafka-ssl
    deadlineSettingsInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.organization.deadlineSettings
      binder: kafka-ssl
    rolesInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.roles
      binder: kafka-ssl
    dispatcherInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.dispatcher
      binder: kafka-ssl
    contractorInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.dispatcher.contractor
      binder: kafka-ssl
    notificationInputSsl-in-0:
      group: ${spring.application.name}-ssl
      destination: service.notification
      binder: kafka-ssl