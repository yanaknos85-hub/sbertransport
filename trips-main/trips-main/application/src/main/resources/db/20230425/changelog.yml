databaseChangeLog:
  - changeSet:
      id: "20230425"
      author: blandin-ad
      changes:
        - tagDatabase:
            tag: "20230425"
        - addColumn:
            schemaName: trips
            tableName: trips
            columns:
              - column:
                  name: driver_waiting_time
                  type: bigint
                  remarks: Время ожидания пассажира водителем
              - column:
                  name: fact_distance
                  type: double precision
                  remarks: Фактическая дистанция поездки
      rollback:
        - dropColumn:
            schemaName: trips
            tableName: trips
            columns:
              - column:
                  name: driver_waiting_time
              - column:
                  name: fact_distance