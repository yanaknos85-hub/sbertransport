databaseChangeLog:
  - changeSet:
      id: "20231020"
      author: blandin-ad
      changes:
        - dropColumn:
            schemaName: trips
            tableName: trips
            columns:
              - column:
                  name: type
      rollback:
        - addColumn:
            schemaName: trips
            tableName: trips
            columns:
              - column:
                  name: type
                  type: varchar(9)
                  remarks: Тип поездки PASSENGER|CARGO
                  defaultValue: PASSENGER
                  defaultOnNull: true
                  constraints:
                    nullable: false
                    notNullConstraintName: trips_trips_type_nn
  - changeSet:
      id: "20231020-1"
      author: blandin-ad
      changes:
        - addNotNullConstraint:
            schemaName: trips
            tableName: dispatcher
            columnName: contractor_id
            constraintName: trips_dispatcher_contractor_id_nn
      rollback:
        - dropNotNullConstraint:
            schemaName: trips
            tableName: dispatcher
            columnName: contractor_id
            constraintName: trips_dispatcher_contractor_id_nn
  - changeSet:
      id: "20231020-2"
      author: blandin-ad
      changes:
        - addColumn:
            schemaName: trips
            tableName: driver
            columns:
              - column:
                  name: service_license_number
                  type: varchar
      rollback:
        - dropColumn:
            schemaName: trips
            tableName: driver
            columns:
              - column:
                  name: service_license_number

  - changeSet:
      id: "20231020-3"
      author: blandin-ad
      changes:
        - renameColumn:
            schemaName: trips
            tableName: driver
