            oldColumnName: firstName
            newColumnName: first_name
        - renameColumn:
            schemaName: trips
            tableName: driver
            oldColumnName: contactPhone
            newColumnName: contact_phone
      rollback:
        - renameColumn:
            schemaName: trips
            tableName: driver
            oldColumnName: human_readable_id
            newColumnName: humanReadableId
        - renameColumn:
            schemaName: trips
            tableName: driver
            oldColumnName: last_name
            newColumnName: lastName
        - renameColumn:
            schemaName: trips
            tableName: driver
            oldColumnName: first_name
            newColumnName: firstName
        - renameColumn:
            schemaName: trips
            tableName: driver
            oldColumnName: contact_phone
