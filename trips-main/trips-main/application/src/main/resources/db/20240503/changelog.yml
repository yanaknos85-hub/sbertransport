databaseChangeLog:
  - changeSet:
      id: "20240503"
      author: blandin-ad
      changes:
        - addColumn:
            schemaName: trips
            tableName: trips
            columns:
              - column:
                  name: planned_shift_id
                  type: uuid
                  remarks: Идентификатор смены, во время которой планируется исполнение поездки
        - addForeignKeyConstraint:
            baseTableSchemaName: trips
            baseTableName: trips
            baseColumnNames: planned_shift_id
            referencedTableSchemaName: trips
            referencedTableName: shift
            referencedColumnNames: id
            constraintName: trips_trips_planned_shift_id_fk
        - addColumn:
            schemaName: trips
            tableName: trip_history
            columns:
              - column:
                  name: new_planned_shift_id
                  type: uuid
                  remarks: Новый идентификатор смены, во время которой планируется исполнение поездки
        - addForeignKeyConstraint:
            baseTableSchemaName: trips
            baseTableName: trip_history
            baseColumnNames: new_planned_shift_id
            referencedTableSchemaName: trips
            referencedTableName: shift
            referencedColumnNames: id
            constraintName: trips_trip_history_new_planned_shift_id_fk
        - addColumn:
            schemaName: trips
            tableName: trip_history
            columns:
              - column:
                  name: old_planned_shift_id
                  type: uuid
                  remarks: Старый идентификатор смены, во время которой планировалось исполнение поездки
        - addForeignKeyConstraint:
            baseTableSchemaName: trips
            baseTableName: trip_history
            baseColumnNames: old_planned_shift_id
            referencedTableSchemaName: trips
            referencedTableName: shift
            referencedColumnNames: id
            constraintName: trips_trip_history_old_planned_shift_id_fk
      rollback:
        - dropColumn:
            schemaName: trips
            tableName: trips
            columns:
              - column:
                  name: planned_shift_id
        - dropColumn:
            schemaName: trips
            tableName: trip_history
            columns:
              - column:
                  name: new_planned_shift_id
        - dropColumn:
            schemaName: trips
            tableName: trips
            columns:
              - column:
                  name: old_planned_shift_id