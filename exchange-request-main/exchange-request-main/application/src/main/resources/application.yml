server:
  port: @server.port@
spring:
  application:
    name: exchange-request
    version: @project.version@
  security:
    user: #убираем запись в логах, по которой есть вопросы у безопасности
      name: anonymous
      password: ${random.uuid}
      roles: anonymous
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: RS512
          jwk-set-uri: ${JWKS_URI}
  config:
    import:
      - classpath:database.yml
      - classpath:application-kubernetes.yml
      - classpath:logging.yml
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
draft:
  clean:
    schedule: ${DRAFT_CLEAN_SCHEDULE:0 0 */2 * * *}
exchange:
  request:
    draft:
      expired-days: ${DRAFT_EXPIRED_DAYS:30}
      prefix: ${DEFAULT_HUMAN_ID_PREFIX:OP}

