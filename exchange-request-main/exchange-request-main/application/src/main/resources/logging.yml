logging:
  level.org.springframework.web.servlet.mvc.method.annotation: TRACE
  level.org.springframework.transaction: "${LOG_HIBERNATE_SQL:INFO}"
  level.org.hibernate.SQL: "${LOG_HIBERNATE_SQL:INFO}"
  level.org.hibernate.type.descriptor.sql.BasicBinder: "${LOG_HIBERNATE_SQL:INFO}"
  level.ru.sber.transport: "${LOG_LEVEL:INFO}"
  pattern:
    file:
      "{
                \"service\": \"${spring.application.name}\",
                \"date\": \"%d{yyyy-MM-dd}\",
                \"time\": \"%d{HH:mm:ss.SSS}\",
                \"level\": \"%level\",
                \"traceId\": \"%X{X-B3-TraceId:-}\",
                \"spanId\": \"%X{X-B3-SpanId:-}\",
                \"parentSpanId\": \"%X{X-B3-ParentSpanId:-}\",
                \"message\": \"%replace(%replace(%msg){'\"', '\\\\\"'}){'[\n\t]', ' '}\",
                \"stack\": [\"%replace(%replace(%replace(%ex){'\"', '\\''}){'\n\t', '\",\"'}){'\n', ''}\"]
            }%nopex%n"
  file:
    path: "${LOG_PATH:../log/services}"
    name: "${logging.file.path}/${spring.application.name}/server.log"
