server:
    port: -1
spring:
    profiles:
        active: test
    config:
        import:
            - database.yml
            - kafka-test.yml
            - export.yml
    cloud:
        discovery:
            enabled: false
            client:
                simple:
                    instances:
                        grpc-files:
                            -   uri: http://localhost:9999
        openfeign:
            client:
                config:
                    korus:
                        url: ${korus.url}
                        error-decoder: ru.sber.transport.telemechanic.client.FeignErrorDecoder
                        default-request-headers:
                            Authorization: ${korus.token}
                    telemedic:
                        url: ${telemedic.url}
                        error-decoder: ru.sber.transport.telemechanic.client.FeignErrorDecoder
                        default-request-headers:
                            Authorization: ${telemedic.token}
        vault:
            enabled: false
    datasource:
        username: postgres
    security:
        user: #убираем запись в логах, по которой есть вопросы у безопасности
            name: anonymous
            password: ${random.uuid}
            roles: anonymous
        oauth2:
            resourceserver:
                jwt:
                    jws-algorithms: RS512
                    public-key-location: classpath:/key/jwt.key.pub
    main:
        banner-mode: off
        lazy-initialization: true
        cloud-platform: none
        allow-bean-definition-overriding: true
    jackson:
        serialization:
            write_dates_as_timestamps: false
    application:
        name: telemechanic
    liquibase:
        contexts: test
    servlet:
        multipart:
            enabled: true
            max-file-size: 30MB
            max-request-size: 30MB
scheduler:
    dispatcher:
        cron: ${DISPATCHER_CRON:0 0 0 * * *}
        lock-at-most-for: ${DISPATCHER_LOCK_AT_MOST_FOR:PT1H}
        lock-at-least-for: ${DISPATCHER_LOCK_AT_LEAST_FOR:PT30M}
    driver:
        cron: ${DRIVER:0 0 0 * * *}
        lock-at-most-for: ${DRIVER_LOCK_AT_MOST_FOR:PT1H}
        lock-at-least-for: ${DRIVER_LOCK_AT_LEAST_FOR:PT30M}
    status:
        ewb:
            cron: ${STATUS_EWB_CRON:0 59 23 * * *}
            lock-at-most-for: ${STATUS_EWB_LOCK_AT_MOST_FOR:PT1H}
            lock-at-least-for: ${STATUS_EWB_LOCK_AT_LEAST_FOR:PT30M}
        request:
            cron: ${STATUS_REQUEST_CRON:0 59 23 * * *}
            lock-at-most-for: ${STATUS_REQUEST_LOCK_AT_MOST_FOR:PT1H}
            lock-at-least-for: ${STATUS_REQUEST_LOCK_AT_LEAST_FOR:PT30M}
        medic-request:
            cron: ${STATUS_MEDIC_REQUEST_CRON:0 59 23 * * *}
            lock-at-most-for: ${STATUS_MEDIC_REQUEST_LOCK_AT_MOST_FOR:PT1H}
            lock-at-least-for: ${STATUS_MEDIC_REQUEST_LOCK_AT_LEAST_FOR:PT30M}
        
