logging:
  level:
    liquibase:
      database: warn
      changelog: warn
    ru.sberbank.ditsib: "${LOG_LEVEL:INFO}"
    org:
      apache.kafka.clients.consumer:
        ConsumerConfig: ERROR
        internals.ConsumerCoordinator: ERROR
      springframework.cloud.stream.messaging.DirectWithAttributesChannel: warn
      apache.kafka.clients.admin.AdminClientConfig: warn
      jooq:
        Constants: ERROR
        tools.LoggerListener: ${SQL_LEVEL:INFO}
  pattern:
    file:
      "{
                \"service\": \"${spring.application.name}\",
                \"date\": \"%d{yyyy-MM-dd}\",
                \"time\": \"%d{HH:mm:ss.SSS}\",
                \"level\": \"%level\",
                \"traceId\": \"%X{X-B3-TraceId:-}\",
                \"spanId\": \"%X{X-B3-SpanId:-}\",
                \"parentSpanId\": \"%X{X-B3-ParentSpanId:-}\",
                \"message\": \"%replace(%replace(%msg){'\"', '\\\\\"'}){'[\n\t]', ' '}\",
                \"stack\": [\"%replace(%replace(%replace(%ex){'\"', '\\''}){'\n\t', '\",\"'}){'\n', ''}\"]
            }%nopex%n"
  file:
    path: "${LOG_PATH:/var/log/services}"
    name: "${logging.file.path}/${spring.application.name}/server.log"