openapi: 3.0.3
info:
  title: Платформа - Адреса
  version: 3.16.0
  description: Сервис для работы с адресами
servers:
  - url: '{scheme}://{host}:{port}{api}'
    description: Адрес для вызова
    variables:
      scheme:
        enum:
          - http
          - https
        default: http
      host:
        default: localhost
      api:
        default: /api/v3.16/address
      port:
        enum:
          - '80'
          - '8080'
          - '443'
          - '8443'
        default: '80'
paths:
  /:
    summary: Адреса
    description: Операции для работы с адресами
    get:
      operationId: getMap
      tags:
        - Addresses
      summary: Получить список адресов
      description: |
        Получить список адресовПолучить список адресов с разбивкой на частые, предпочтительные и остальные. Адреса не дублируются: если адрес есть в частых, его не будет в списке остальных.
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Поисковая строка
        - in: query
          name: latitude
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            multipleOf: 0.000001
          description: Широта в десятичном формате
        - in: query
          name: longitude
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            multipleOf: 0.000001
          description: Долгота в десятичном формате
        - in: query
          name: viewport_top_left_latitude
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            multipleOf: 0.000001
          description: |
            Верхняя левая граница области. Широта. Используется для сужения квадрата поиска.
        - in: query
          name: viewport_top_left_longitude
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            multipleOf: 0.000001
          description: |
            Верхняя левая граница области. Долгота. Используется для сужения квадрата поиска.
        - in: query
          name: viewport_bottom_right_latitude
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            multipleOf: 0.000001
          description: |
            Нижняя правая граница области. Широта. Используется для сужения квадрата поиска.
        - in: query
          name: viewport_bottom_right_longitude
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            multipleOf: 0.000001
          description: |
            Нижняя правая граница области. Долгота. Используется для сужения квадрата поиска.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Список адресов
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Address'
        '400':
          content:
            application/json:
              schema:
                description: Формат запроса сформированный клиентом не корректен
                type: object
                properties:
                  message:
                    title: Сообщение об ошибке
                    description: Общее сообщение об ошибке
                    type: string
                  timestamp:
                    title: Дата-время
                    type: string
                    format: date-time
                  path:
                    title: Путь запроса
                    type: string
                  problems:
                    title: Список проблем
                    description: Список выявленных нестыковок с форматом
                    type: array
                    items:
                      description: Описание проблемы запроса
                      type: object
                      properties:
                        field:
                          title: Поле
                          description: Наименование поля с проблемой
                          type: string
                        value:
                          title: Значение
                          description: Полученное от клиента значение
                          type: string
                        constraints:
                          title: Ограничения
                          description: Список ограничений на поле
                          type: array
                          items:
                            description: Описание ограничения
                            type: object
                            properties:
                              type:
                                title: Тип
