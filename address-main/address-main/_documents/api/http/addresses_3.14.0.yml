OrPresent</td><td>Значение не должно быть в будущем</td><td></td></tr> <tr><td>Pattern</td><td>Значение должно соответствовать шаблону</td><td><ul><li>pattern - Допустимый шаблон в формате RegExp</li></ul></td></tr> <tr><td>Positive</td><td>Значение должно быть положительным</td><td></td></tr> <tr><td>PositiveOrZero</td><td>Значение не должно быть отрицательным</td><td></td></tr> <tr><td>Size</td><td>Значение должно соответствовать размеру</td><td><ul><li>min - Минимальный размер</li><li>max - Максимальный размер</li></ul></td></tr> </table>
                                type: string
                                format: enum
                                enum:
                                  - AssertFalse
                                  - AssertTrue
                                  - DecimalMax
                                  - DecimalMin
                                  - Digits
                                  - Email
                                  - Enum
                                  - Future
                                  - FutureOrPresent
                                  - Max
                                  - Min
                                  - Negative
                                  - NegativeOrZero
                                  - NotBlank
                                  - NotEmpty
                                  - NotNull
                                  - 'Null'
                                  - Past
                                  - PastOrPresent
                                  - Pattern
                                  - Positive
                                  - PositiveOrZero
                                  - Size
                              value:
                                title: Допустимое значение
                                description: Описание допустимых значений. Зависит от type
                                type: object
          description: Запрос неверно сформирован
        '401':
          content:
            application/json:
              schema:
                description: Пользователь не авторизован или токен истек/отозван
          description: Запрос не авторизован
        '403':
          content:
            application/json:
              schema:
                description: Пользователь авторизован, но у него нет прав доступа к ресурсу
          description: Не достаточно прав
        '404':
          content:
            application/json:
              schema:
                description: По указанному URL не найден ресурс
                type: object
                properties:
                  message:
                    title: Сообщение об ошибке
                    description: Общее сообщение об ошибке
                    type: string
                  path:
                    title: Путь запроса
                    type: string
                  entity:
                    description: Запрашиваемая сущность
                    properties:
                      id:
                        title: Идентификатор
                        description: Идентификатор запрашиваемой сущности
                        type: string
                      name:
                        title: Название
                        description: Название запрашиваемой сущности
                        type: string
                  timestamp:
                    title: Дата-время
                    type: string
                    format: date-time
          description: Ресурс не найден
