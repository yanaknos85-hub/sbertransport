spring:
  cloud:
    stream:
      binders:
        kafka-ssl:
          type: kafka
          environment:
            spring.cloud.stream.kafka:
              default.consumer.enableDlq: true
              binder:
                configuration:
                  security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
                  ssl:
                    endpoint.identification.algorithm: ""
                    client.auth: required
                    enabled.protocols: TLSv1.2
                    truststore:
                      location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
                      password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
                    keystore:
                      location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
                      password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
                    key.password: ${KAFKA_SSL_KEY_PASSWORD:}
                auto-alter-topics: true
                autoAddPartitions: true
                brokers:
                  - ${KAFKA_SSL_BROKERS}
              producerProperties.key.serializer: org.springframework.kafka.support.serializer.JsonSerializer
              consumerProperties:
                key.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
                dlqProducerProperties.key.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
                standardHeaders: both
      bindings:
        userAddressInputSsl-in-0:
          group: ${spring.application.name}-ssl
          destination: service.request.address.used
          binder: kafka-ssl
        employeeInputSsl-in-0:
          group: ${spring.application.name}-ssl
          destination: service.organization.employee
          binder: kafka-ssl