kind: ConfigMap
apiVersion: v1
metadata:
  name: kubernetes
  namespace: ci02351878-edevgen-sbertransport-dev
data:
  application-kubernetes.yml: |
    spring:
      cloud:
        kubernetes.enabled: true
        discovery:
          client:
            health-indicator:
              enabled: false
        kubernetes:
          discovery:
            enabled: true
          config:
            enabled: false
            enable-api: false
          secrets:
            enabled: false
