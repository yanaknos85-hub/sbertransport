syntax = "proto3";

import "google/protobuf/timestamp.proto";
package ru.sber.transport.token_generator.grpc.dto;

message UserRequest {
  repeated string role = 1;
  google.protobuf.Timestamp expiration = 2;
  google.protobuf.Timestamp issuedAt = 3;
  string subject = 4;
  string id = 5;
  RequestorType type = 6;
}

message JwtData {
  string value = 1;
}

enum RequestorType {
  basic = 0;
  digest = 1;
}