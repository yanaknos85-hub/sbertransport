spring:
  cloud.config.uri: http://localhost:8080
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: root
    type: com.zaxxer.hikari.HikariDataSource
  liquibase:
    enabled: true
    change-log: db/changelog-master.yml
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    database-change-log-table: changelog_${spring.application.name}
    database-change-log-lock-table: changelog_${spring.application.name}_lock
    default-schema: ${spring.application.name}
    liquibase-schema: ${MIGRATION_SCHEMA:public}
android:
  appName: ${random.uuid}
  credentials:
    path: classpath:firebase.json
ios:
  development: true
  credentials:
    password: vertikal
    path: classpath:apns.key