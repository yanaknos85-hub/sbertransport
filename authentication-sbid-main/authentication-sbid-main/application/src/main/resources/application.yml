app:
  truststore: ${APP_TRUSTSTORE:truststore.jks}
  publicDerKey: ${APP_DER_KEY:key/certificate.pub}
  truststore-password: ${APP_TRUSTSTORE_PASSWORD:changeit}
  keystore: ${APP_KEYSTORE:client.p12}
  keystore-password: ${APP_KEYSTORE_PASSWORD:changeit}
  privateKey: ${APP_PRIVATE_KEY:key/jwt.key}
  privatePemKey: ${APP_PRIVATE_DER_KEY:keys/private-key.pem}
server:
  port: @server.port@
springdoc:
  api-docs:
     openapi-version: OPENAPI_3_1
     path: /v3/api-docs
  swagger-ui:
     path: /swagger-ui.html

  # Метаданные API
  info:
    title: Authentication SBID API
    description: Сервис авторизации через SberBusinessID
    version: 1.0.0
spring:
  application:
    name: authentication_sbid
    version: @project.version@
  main:
    cloud-platform: none
    banner-mode: off
    allow-bean-definition-overriding: true
  config:
    import:
      database.yml, logging.yml
  security:
    user: #убираем запись в логах, по которой есть вопросы у безопасности
      name: anonymous
      password: ${random.uuid}
      roles: anonymous
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: RS512
          public-key-location: classpath:/key/jwt.key.pub
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
cargo:
  user:
    restUrl: ${REST_URL_USER:http://sbi.sbermock.sigma.sbrf.ru}
    postAuthMetod: ${POST_AUTH_USER:/v1/profile/create}
  sbid:
    urlSbid: ${URL_SBID:https://efs-sbbol-ift-web.testsbi.sberbank.ru:9443}
    restUrlSbid: ${REST_URL_SBID:http://sbi.sbermock.sigma.sbrf.ru}
    getAuthMetod: ${GET_AUTH:/ic/sso/api/v2/oauth/authorize}
    postAuthMetod: ${POST_AUTH:/ic/sso/api/v2/oauth/token/}
    userInfoMetod: ${GET_USER_INFO:/ic/sso/api/v2/oauth/user-info}
    clientId: ${CLIENT_ID:24031}
    responseType: ${RESPONSE_TYPE:code}
    redirectUri: ${REDIRECT_URI:http://localhost:5555}
    scope: ${SCOPE:openid+acr+amr+aud+auth_time+azp+exp+iat+iss+nonce+sid2+sub+HashOrgId+OrgName+aud+email+individualExecutiveAgency+inn+iss+name+offerExpirationDate+orgActualAddress+orgFullName+orgJuridicalAddress+orgKpp+orgLawForm+orgLawFormShort+orgOgrn+orgOktmo+phone_number+sub+terBank+userPosition+userSignatureType}
    clientSecret: ${CLIENT_SECRET:|xpt1xq,}
files:
  service-name: authentication-sbid

