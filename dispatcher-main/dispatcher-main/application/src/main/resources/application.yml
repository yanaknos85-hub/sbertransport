server:
    port: @server.port@
spring:
    main:
        banner-mode: off
    config:
        import:
            - optional:configserver:${spring.cloud.config.uri}
    security:
        user:
            name: anonymous
            password: ${random.uuid}
            roles: anonymous
        oauth2:
            resourceserver:
                jwt:
                    jws-algorithms: RS512
                    jwk-set-uri: ${JWKS_URI}
    jackson:
        default-property-inclusion: non_null
    application:
        name: dispatcher
        version: @project.version@
    cloud:
        grpc:
            discovery:
                server: grpc-service-discovery:6565
        kubernetes.enabled: false
        consul.enabled: false
        vault.enabled: false
    datasource:
        driver-class-name: org.postgresql.Driver
        type: com.zaxxer.hikari.HikariDataSource
        hikari:
            maximum-pool-size: ${MAX_POOL_SIZE:3}
            connection-test-query:  SELECT 1
            schema: dispatcher
    jpa:
        properties:
            hibernate:
                jdbc:
                    batch_size: 25
                    lob:
                        non_contextual_creation: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: none
        show-sql: false
        open-in-view: false
    liquibase:
        enabled: true
        change-log: db/changelog-master.yml
        url: ${spring.datasource.url}
        user: ${spring.datasource.username}
        password: ${spring.datasource.password}
        database-change-log-table: changelog_${spring.application.name}
        database-change-log-lock-table: changelog_${spring.application.name}_lock
        liquibase-schema: ${MIGRATIONS_SCHEMA:public}
    profiles:
        active: prod,import,logging,kafka
    servlet:
        multipart:
            enabled: true
            max-file-size: ${file.max-size}
            max-request-size: ${file.max-size}
management:
    endpoints:
        web:
            exposure:
                include: "health"
file:
    max-size: ${FILE_MAX_SIZE:5MB}
websocket:
    baseUrl: /ws
authorization:
    consent-check: ${CHECK_CONSENT:true}
grpc:
    server:
        port: 6565
    client:
        ewb:
            address: discovery:/grpc-ewb
            negotiationType: plaintext