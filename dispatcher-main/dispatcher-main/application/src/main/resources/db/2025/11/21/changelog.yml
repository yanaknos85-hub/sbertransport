databaseChangeLog:
  - changeSet:
      id: 20251121-01
      author: gusev-ea
      changes:
        - addColumn:
            schemaName: dispatcher
            tableName: driver
            columns:
              - column:
                  name: personnel_number
                  type: varchar(255)
                  remarks: Табельный номер
        - addColumn:
            schemaName: dispatcher
            tableName: driver
            columns:
              - column:
                  name: snils
                  type: varchar(12)
                  remarks: СНИЛС
        - addColumn:
            schemaName: dispatcher
            tableName: driver
            columns:
              - column:
                  name: tin
                  type: varchar(16)
