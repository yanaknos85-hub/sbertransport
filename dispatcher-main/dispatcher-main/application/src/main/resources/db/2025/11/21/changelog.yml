              - column:
                  name: tin
        - dropColumn:
            schemaName: dispatcher
            tableName: driver
            columns:
              - column:
                  name: issue_date
        - dropColumn:
            schemaName: dispatcher
            tableName: driver
            columns:
              - column:
                  name: expiry_date