        |CONFIRMED                      |Подтверждено                                            |
        |DECLINED                       |Отклонено                                               |
        |CANCELLED                      |Заявка отменена                                         |
        |ORDER_PAYMENT_FORMATION        |Формирование приказа на выплату                         |
        |PAYMENT_AWAITING               |Ожидание выплаты                                        |
