openapi: 3.0.3
info:
  title: Заявка на Яндекс-go
  version: 4.22.0
  description: Набор операций по работе с заявками на ЯНдекс-go
servers:
  - url: '{scheme}://{host}:{port}{api}'
    description: Адрес для вызова
    variables:
      scheme:
        enum:
          - http
          - https
        default: http
      host:
        default: localhost
      api:
        default: /api/request/v4.9/external/
      port:
        enum:
          - '80'
          - '8080'
          - '443'
          - '8443'
        default: '80'
paths:
  /:
    summary: Заявки на Яндекс-go
    description: Операции с заявками на Яндекс-go
    post:
      summary: Добавить
      description: Добавить заявку
      tags:
        - externalRequestCommand
      operationId: add
      requestBody:
        $ref: '#/components/requestBodies/NewExternalRequest'
      responses:
        '201':
          $ref: '#/components/responses/ExternalRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: Получить все
      description: Получить все заявки
      tags:
        - externalRequestQuery
      operationId: getAll
      parameters:
        - in: query
          required: false
          name: kind
          description: Тип пользователя. Заявки выбираются в зависимости от значения этого фильтра (та, где вошедший пользователь является пассажиром или согласовантом)
          schema:
            $ref: '#/components/schemas/OrderKind'
        - in: query
          required: false
          name: humanReadableId
          description: Фильтр по человекочитаемому идентификатору
          schema:
            type: string
        - in: query
          required: false
          description: Фильтр по БЕ
          name: balanceUnitSet
          schema:
            type: array
            maxItems: 10000000
            items:
              type: integer
              format: int32
        - in: query
          required: false
          description: Фильтр по МВЗ
          name: costCenter
          schema:
            type: string
        - in: query
          required: false
          description: Фильтр по статусам
          name: status
          schema:
            type: array
            maxItems: 10000000
            items:
              $ref: '#/components/schemas/State'
        - in: query
          required: false
          description: Фильтр по пассажирам
          name: passenger
          schema:
            type: array
            maxItems: 10000000
            items:
              title: Идентификатор
              type: string
              format: uuid
        - in: query
          required: false
          description: Фильтр по согласующим
          name: approver
          schema:
            type: array
            maxItems: 10000000
            items:
              title: Идентификатор
              type: string
              format: uuid
        - in: query
          name: startFrom
          description: Фильтр по времени начала - от
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: startTo
          description: Фильтр по времени начала - до
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: passengerName
          description: Фильтр по пассажиру
          required: false
          schema:
            type: string
        - in: query
          name: approverName
          description: Фильтр по согласующему
          required: false
          schema:
            type: string
        - in: query
          name: format
          required: false
          description: Формат ответа
          schema:
            $ref: '#/components/schemas/Format'
        - in: query
          name: page
          required: false
          description: Страница
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          required: false
          description: Размер страницы
          schema:
            type: integer
            default: 20
            minimum: 0
        - in: query
          name: sort
          required: false
          description: Поле для сортировки. По-умолчанию humanReadableId
          schema:
            type: string
            default: humanReadableId
        - in: query
          name: direction
          required: false
          description: Направление сортировки. По-умолчанию DESC
          schema:
            default: DESC
            allOf:
              - $ref: '#/components/schemas/SortDirection'
      responses:
        '200':
          $ref: '#/components/responses/ExternalRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /report:
    post:
      summary: Получить все (с фильтром в теле)
      description: Получить все заявки
      tags:
        - externalRequestQuery
      operationId: getReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  $ref: '#/components/schemas/RegistryFilterRq'
                page:
                  type: integer
                  default: 0
                  minimum: 0
                size:
                  type: integer
                  default: 20
                  minimum: 0
                sort:
                  type: string
                  default: humanReadableId
                direction:
                  $ref: '#/components/schemas/SortDirection'
              required:
                - filter
      responses:
        '200':
          $ref: '#/components/responses/ExternalRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /{requestId}:
    summary: Одна завка
    description: Работа с одной заявкой
    parameters:
      - in: path
        name: requestId
        description: Идентификатор заявки
        required: true
        schema:
          title: Идентификатор
          type: string
          format: uuid
    get:
      summary: Получить
      description: Получить информацию об одной заявке
      tags:
        - externalRequestQuery
      parameters:
        - in: header
          name: If-Modified-Since
          required: false
          description: Условный заголовок "если изменилось после". Если объект не менялся до указанной даты, будет возвращен ответ 304 Not Modified. Заголовок служит для снижения нагрузки на бэк и базу.
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      operationId: get
      responses:
        '200':
          $ref: '#/components/responses/ExternalRequest'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Изменить
      description: Изменить информацию о заказе
      tags:
        - externalRequestCommand
      operationId: edit
      parameters:
        - in: header
          name: If-Unmodified-Since
          required: false
          description: Условный заголовок "если не изменилось после". Если объект менялся после указанной даты, будет возвращен ответ 412 Precondition failed. Заголовок служит для исключения одновременного изменения одного и того же объекта.
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      requestBody:
        $ref: '#/components/requestBodies/EditExternalRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/Precondition'
    patch:
      summary: Частичное изменение
      description: Частичное изменение объекта. Позволяет менять отдельные атрибуты не затрагивая всего объекта. Для изменения доступны только те поля, которые можно изменить через `PUT`-запрос
      tags:
        - externalRequestCommand
      operationId: editPartially
      parameters:
        - in: header
          name: If-Unmodified-Since
          required: false
          description: Условный заголовок "если не изменилось после". Если объект менялся после указанной даты, будет возвращен ответ 412 Precondition failed. Заголовок служит для исключения одновременного изменения одного и того же объекта.
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      requestBody:
        $ref: '#/components/requestBodies/Patch'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/Precondition'
    delete:
      summary: Удаление
      description: Удаление объекта
      tags:
        - externalRequestCommand
      operationId: delete
      parameters:
        - in: header
          name: If-Unmodified-Since
          required: false
          description: Условный заголовок "если не изменилось после". Если объект менялся после указанной даты, будет возвращен ответ 412 Precondition failed. Заголовок служит для исключения одновременного изменения одного и того же объекта.
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/Precondition'
    head:
      summary: Мета данные
      description: Мета данные объекта. Позволяет получить состояние объекта без запроса всего набора данных
      tags:
        - externalRequestQuery
      operationId: meta
      parameters:
        - in: header
          name: If-Modified-Since
          required: false
          description: Условный заголовок "если не изменилось после". Если объект менялся после указанной даты, будет возвращен ответ 412 Precondition failed. Заголовок служит для исключения одновременного изменения одного и того же объекта.
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/Precondition'
  /{requestId}/files:
    summary: Файлы по заявке
    description: Работа с файлами заявки
    parameters:
      - in: path
        name: requestId
        description: Идентификатор заявки
        required: true
        schema:
          title: Идентификатор
          type: string
          format: uuid
    post:
      summary: Отправить
      description: Опубликовать файл, связанный с заявкой
      tags:
        - externalRequestFiles
      operationId: postFile
      requestBody:
        $ref: '#/components/requestBodies/File'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedNoHeaders'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: Получить
      description: Получить данные файла
      tags:
        - externalRequestFiles
      operationId: getFile
      parameters:
        - in: header
          name: Content-Range
          description: Получение части контента (от-до)
          schema:
            type: string
            title: Данные для получения фрагмента
            description: Данные о полученном фрагменте файла (от-до)
            example: bytes 100-200
      responses:
        '200':
          $ref: '#/components/responses/File'
        '204':
          $ref: '#/components/responses/NoFile'
        '206':
          $ref: '#/components/responses/PartiallyFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Удалить
      description: Удалить файл
      tags:
        - externalRequestFiles
      operationId: deleteFile
      responses:
        '204':
          $ref: '#/components/responses/AcceptedNoHeaders'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /allow:
    summary: Энд-поинты ограничений
    description: Список операция для работы с ограничениями
    get:
      deprecated: true
      tags:
        - temporary
      summary: Создание заказа
      description: Эндпоинт проверки возможности создания заказа. `Только на время проведения MVP для ограничения выборки`.
      operationId: allowOrder
      responses:
        '200':
          $ref: '#/components/responses/Allowed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /{requestId}/history:
    summary: История изменений статусов заявки
    description: Получение истории изменений статусов для конкретной заявки
    parameters:
      - in: path
        name: requestId
        description: Идентификатор заявки
        required: true
        schema:
          title: Идентификатор
          type: string
          format: uuid
    get:
      summary: Получить историю статусов
      description: Возвращает список всех изменений статусов заявки с указанием времени изменения
      tags:
        - externalRequestQuery
      operationId: getStatusHistory
      responses:
        '200':
          description: Успешный запрос, возвращает историю изменений статусов
          content:
            application/json:
              schema:
                type: array
                maxItems: 10000000
                items:
                  $ref: '#/components/schemas/TripOrderStatusHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{organizationId}/departments/filter-registry:
    get:
      summary: Получить все отделы с уровнями(1-6) для фильтров в реестре.
      description: Возвращает список всех активных департаментов организации с их идентификаторами, уровнями и названиями
      tags:
        - externalDepartmentsQuery
      operationId: getDepartmentsForRegistryFilters
      parameters:
        - in: path
          name: organizationId
          description: Идентификатор организации
          required: true
          schema:
            title: Идентификатор
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ. Список департаментов.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10000000
                items:
                  $ref: '#/components/schemas/DepartmentRegistryFilterRs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /files/payment-report-registry:
    summary: Формирование реестра к выплате
    description: Формирование ссылки на скачивание реестра к выплате
    get:
      summary: Получить ссылку на реестр к выплате
      description: Получить ссылку на отфильтрованный реестр к выплате
      tags:
        - externalRequestRegistry
      operationId: getPaymentRegistryLink
      parameters:
        - in: query
          required: false
          name: humanReadableId
          description: Фильтр по человекочитаемому идентификатору
          schema:
            type: string
        - in: query
          required: false
          description: Фильтр по БЕ
          name: balanceUnitSet
          schema:
            type: array
            maxItems: 10000000
            items:
              type: integer
              format: int32
        - in: query
          required: false
          description: Фильтр по МВЗ
          name: costCenter
          schema:
            type: string
        - in: query
          name: startFrom
          description: Фильтр по времени начала - от
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: startTo
          description: Фильтр по времени начала - до
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: passengerName
          description: ФИО пассажира
          required: false
          schema:
            type: string
        - in: query
          name: approverName
          description: ФИО согласующего
          required: false
          schema:
            type: string
        - in: query
          name: paymentFormationStart
          description: Дата формирования приказа от
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: paymentFormationEnd
          description: Дата формирования приказа до
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
      responses:
        '200':
          $ref: '#/components/responses/RegistryLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /files/registry:
    summary: Скачивание реестра
    description: Формирование ссылки на скачивание реестра
    get:
      summary: Получить ссылку
      description: Получить ссылку на отфильтрованный реестр
      tags:
        - externalRequestRegistry
      operationId: getRegistryLink
      parameters:
        - in: query
          required: false
          name: humanReadableId
          description: Фильтр по человекочитаемому идентификатору
          schema:
            type: string
        - in: query
          required: false
          description: Фильтр по БЕ
          name: balanceUnitSet
          schema:
            type: array
            maxItems: 10000000
            items:
              type: integer
              format: int32
        - in: query
          required: false
          description: Фильтр по МВЗ
          name: costCenter
          schema:
            type: string
        - in: query
          required: false
          description: Фильтр по статусам
          name: status
          schema:
            type: array
            maxItems: 10000000
            items:
              $ref: '#/components/schemas/State'
        - in: query
          name: startFrom
          description: Фильтр по времени начала - от
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: startTo
          description: Фильтр по времени начала - до
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: passengerName
          description: ФИО пассажира
          required: false
          schema:
            type: string
        - in: query
          name: approverName
          description: ФИО согласующего
          required: false
          schema:
            type: string
        - in: query
          name: paymentFormationStart
          description: Дата формирования приказа от
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
        - in: query
          name: paymentFormationEnd
          description: Дата формирования приказа до
          required: false
          schema:
            title: Дата-время с зоной
            type: string
            format: date-time
            example: 2024-01-01T10:05:10.023+0300
      responses:
        '200':
          $ref: '#/components/responses/RegistryLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  responses:
    Allowed:
      description: Список разрешений
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Allowed'
    File:
      description: Файл получен
      content:
        image/*:
          schema:
            $ref: '#/components/schemas/FileContent'
    NoFile:
      description: Запрос обработан успешно, данных в ответе нет
    PartiallyFile:
      description: Файл получен частично
      content:
        image/*:
          schema:
            $ref: '#/components/schemas/FileContent'
      headers:
        Content-Range:
          schema:
            type: string
            title: Ответ о файле
            description: Данные о полученном фрагменте файла (от-до/размер)
            example: bytes 100-200/1024
    Accepted:
      description: Запрос принят, изменения в системе
      headers:
        etag:
          description: Хэш объекта
          schema:
            type: string
        last-modified:
          description: Время когда изменился объект
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
    AcceptedNoHeaders:
      description: Запрос принят, изменения в системе
    ExternalRequests:
      description: Список заявок
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalRequestPage'
    ExternalRequest:
      description: Запрос принят, заявка создана
      content:
