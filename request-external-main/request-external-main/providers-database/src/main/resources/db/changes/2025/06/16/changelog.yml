databaseChangeLog:
  - changeSet:
      id: "20250616-1510"
      author: medvedev-ad
      context: "TRANSPORT-32978"
      changes:
        - tagDatabase:
            tag: "D-04.011.000"
        - dropColumn:
            schemaName: ${schema_name}
            tableName: delegates
            columnName: id
        - addPrimaryKey:
            schemaName: ${schema_name}
            tableName: delegates
            columnNames: supervisor_id, delegate_id, start_date
            primaryKeyName: ${schema_name}_delegates_pk
      rollback:
