            schemaName: ${schema_name}
            tableName: delegates
            primaryKeyName: ${schema_name}_delegates_pk
        - addColumn:
            schemaName: ${schema_name}
            tableName: delegates
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: 'Идентификатор записи'
                  constraints:
                    primaryKey: true
                    primaryKeyName: ${schema_name}_delegates_pk