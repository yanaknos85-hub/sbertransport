databaseChangeLog:
    -   changeSet:
            id: "20221121-4"
            author: blandin-ad
            preConditions:
                -   onFail: MARK_RAN
                -   not:
                        -   columnExists:
                                schemaName: tariff
                                tableName: tariff
                                columnName: code
            changes:
                - addColumn:
                        schemaName: tariff
                        tableName: tariff
                        columns:
                            - column:
