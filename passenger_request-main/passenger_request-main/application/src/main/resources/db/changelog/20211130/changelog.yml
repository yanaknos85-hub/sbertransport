databaseChangeLog:
    -   changeSet:
            id: "20211130"
            author: nikandrov-ae
            dbms: postgresql
            preConditions:
                -   tableExists:
                        schemaName: request
                        tableName: request_for_cargo
                -   tableExists:
                        schemaName: request
                        tableName: cargo_detail
            changes:
                -   sqlFile:
                        path: alter_cargo_tables.sql
                        relativeToChangelogFile: true
                        endDelimiter: ;
            rollback:
                -   sqlFile:
                        path: rollback_alter_cargo_tables.sql
                        relativeToChangelogFile: true
                        endDelimiter: ;