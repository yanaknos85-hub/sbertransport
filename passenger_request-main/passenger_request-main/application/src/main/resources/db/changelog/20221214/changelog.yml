databaseChangeLog:
    -   changeSet:
            id: "20221214"
            author: delyukov-da
            dbms: postgresql
            changes:
                -   addColumn:
                        schemaName: request
                        tableName: request_for_public
                        columns:
                            -   column:
                                    name: rating_mark
                                    type: integer
                                    remarks: Оценка
                            -   column:
                                    name: rating_comment
                                    type: varchar(255)
                                    remarks: Комментарий к оценке
            rollback:
                -   dropColumn:
                        schemaName: request
                        tableName: request_for_public
                        columnName: rating_mark
                -   dropColumn:
                        schemaName: request
                        tableName: request_for_public
                        columnName: rating_comment