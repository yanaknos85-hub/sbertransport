databaseChangeLog:
    -   changeSet:
            id: "20240306"
            author: delyukov-da
            changes:
                -   tagDatabase:
                        tag: "20240306"
                -   addColumn:
                        schemaName: request
                        tableName: request_for_personal
                        columns:
                            -   column:
                                    name: payment_done_datetime
                                    type: timestamp
                                    remarks: Время выплаты компенсации по заявке
                            -   column:
                                    name: payment_done_deadline
                                    type: timestamp
                                    remarks: Максимальное время выплаты компенсации по заявке без нарушения контрольного срока
                            -   column:
                                    name: payment_done_deadline_state
                                    type: text
                                    defaultValue: NONE
                                    constraints:
                                        nullable: false
                                    remarks: Индикатор контрольного срока выплаты компенсации по заявке
            rollback:
                -   dropColumn:
                        schemaName: request
                        tableName: request_for_personal
                        columns:
                            -   column:
                                    name: payment_done_deadline_state
                            -   column:
                                    name: payment_done_deadline
                            -   column:
                                    name: payment_done_datetime