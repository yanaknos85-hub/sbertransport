      negotiation-type: plaintext
    files:
      address: discovery:///${grpc.files:grpc-files-v2}
    limits:
      address: discovery:///${grpc.limits:grpc-limits}
    geo-zones:
      address: discovery:///${grpc.geo-zones:grpc-geo-zones}
    srm:
      address: discovery:///${grpc.srm:grpc-srm}
    integrations-carsharing:
      address: discovery:///${grpc.integrations-carsharing:grpc-integrations-carsharing}
    tariff:
      address: discovery:///${grpc.tariff:grpc-tariff}
    contractor:
      address: discovery:///${grpc.grpc-contractor:grpc-contractor}
    easup:
      address: discovery:///${grpc.grpc-easup:grpc-easup}
    request-checks:
