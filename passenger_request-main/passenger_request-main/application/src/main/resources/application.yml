server:
  port: 8082
  tomcat:
    relaxed-query-chars:
      - "["
      - "]"
spring:
  config:
    import:
      - optional:configserver:${SPRING_CLOUD_CONFIG_URI}
      - kafka.yml
  application:
    name: request
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 25
      schema: ${spring.application.name}
  jpa:
    properties:
      org:
        hibernate:
          envers:
            store_data_at_delete: true
      hibernate:
        jdbc:
          batch_size: 25
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yml
    drop-first: false
    test-rollback-on-update: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    database-change-log-table: changelog_${spring.application.name}
    database-change-log-lock-table: changelog_${spring.application.name}_lock
    liquibase-schema: ${MIGRATIONS_SCHEMA:public}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${file.max-size}
      max-request-size: ${file.max-size}
  jackson:
    default-property-inclusion: non_null
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: true
      WRITE_DATE_TIMESTAMPS_AS_NANOSECONDS: false
  profiles:
    active: prod
    include: import-export
  cloud:
    vault:
      enabled: false
management.endpoints.web.exposure.include: "*"
ssl:
  support: true
  client:
    enabled: ${CLIENT_ENABLED:false}
    store:
      path: ${CLIENT_CERTIFICATE:}
      password: ${CLIENT_STORE_PASSWORD:}
    password: ${CLIENT_CERT_PASSWORD:}
  trust:
    enabled: ${TRUST_ENABLED:false}
    store:
      path: ${TRUST_CERTIFICATE:}
      password: ${TRUST_CERT_PASSWORD:}
