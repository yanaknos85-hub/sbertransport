syntax = "proto3";

package ru.sber.transport.request_checks.grpc;

option java_multiple_files = true;
option java_package = "ru.sber.transport.request_checks.grpc";
option java_outer_classname = "RequestChecksProto";

import "google/protobuf/timestamp.proto";

// Запрос на проверку многоточечных поездок
message CheckMultipointLimitRequest {
    // ID пассажира
    string passengerId = 1;

    // Дата-время поездки
    google.protobuf.Timestamp desiredDate = 2;

    // Часовой пояс в формате ISO 8601 (например, "+03:00")
    string timeZone = 3;
}

// Ответ на проверку
message CheckMultipointLimitResponse {
    // Успешная проверка (пустой ответ)
}

// gRPC сервис для проверки многоточечных поездок
service MultipointRequestCheckService {
    // Проверка лимита многоточечных поездок
    // Многоточечная поездка — это заявка с количеством адресов (waypoints) > 2
    // Если таких заявок больше лимита, выбрасывается исключение
    rpc CheckMultipointLimit(CheckMultipointLimitRequest) returns (CheckMultipointLimitResponse);
}

// Запрос на проверку длительности поездки
message CheckDurationLimitRequest {
    // ID пассажира
    string passengerId = 1;

    // Дата-время поездки
    google.protobuf.Timestamp desiredDate = 2;

    // Ожидаемая продолжительность поездки в миллисекундах
    int64 expectedDuration = 3;

    // Часовой пояс в формате ISO 8601 (например, "+03:00")
    string timeZone = 4;
}

// Ответ на проверку длительности
message CheckDurationLimitResponse {
    // Успешная проверка (пустой ответ)
}

// Запрос на проверку превышения лимита суммарного километража
message CheckOverrunLimitRequest {
    // ID пассажира
    string passengerId = 1;

    // Дата-время поездки
    google.protobuf.Timestamp desiredDate = 2;

    // Ожидаемая дистанция поездки в метрах
    int32 expectedDistance = 3;

    // Часовой пояс в формате ISO 8601 (например, "+03:00")
    string timeZone = 4;
}

// Ответ на проверку превышения лимита суммарного километража
message CheckOverrunLimitResponse {
    // Комментарий (описание нарушения)
    string comment = 1;

    // Суммарная дистанция за период в метрах
    int32 totalDistance = 2;
}

// gRPC сервис для проверки поездок
service RequestCheckService {
    // Проверка лимита длительности поездок
    // Сумма длительности всех поездок за день + новая поездка не должна превышать 12 часов
    rpc CheckDurationLimit(CheckDurationLimitRequest) returns (CheckDurationLimitResponse);
}

// gRPC сервис для проверки превышения лимита суммарного километража
service OverrunRequestCheckService {
    // Проверка превышения лимита суммарного километража
    // Если суммарный километраж за месяц превышает лимит, то в ответе приходит comment с описанием
    rpc CheckOverrunLimit(CheckOverrunLimitRequest) returns (CheckOverrunLimitResponse);
}