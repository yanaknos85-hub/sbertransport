syntax = "proto3";

package ru.sber.transport.integrations.carsharing.grpc.dto;
option java_package = "ru.sber.transport.integrations.carsharing.grpc.dto";

message EmployeeInfo {

    int32 corporateId = 1;

    int32 groupId = 2;

    string fullName = 3;

    string position = 4;

    string phoneNumber = 5;

}