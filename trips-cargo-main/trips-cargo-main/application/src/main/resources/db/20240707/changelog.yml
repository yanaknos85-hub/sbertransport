databaseChangeLog:
  - changeSet:
      id: "20240707-1"
      author: nikandrov-ae
      changes:
        - addColumn:
            schemaName: trips_cargo
            tableName: trips
            columns:
              - column:
                  name: loaders
                  type: integer
                  remarks: Количество грузчиков на маршруте
