databaseChangeLog:
  - changeSet:
      id: "20231003"
      author: blandin-ad
      changes:
        - createTable:
            schemaName: trips_cargo
            tableName: shift
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: Идентификатор
                  constraints:
                    primaryKey: true
              - column:
                  name: contractor_id
                  type: uuid
                  remarks: Идентификатор контрагента
                  constraints:
                    foreignKeyName: trips_cargo_shift_contractor_fk
                    referencedColumnNames: id
                    referencedTableName: contractors
                    referencedTableSchemaName: trips_cargo
              - column:
                  name: driver_id
                  type: uuid
                  remarks: Идентификатор водителя
                  constraints:
                    foreignKeyName: trips_cargo_shift_driver_fk
                    referencedColumnNames: id
                    referencedTableName: driver
                    referencedTableSchemaName: trips_cargo
              - column:
                  name: vehicle_id
                  type: uuid
                  remarks: Идентификатор автомобиля
                  constraints:
                    foreignKeyName: trips_cargo_shift_vehicle_fk
                    referencedColumnNames: id
                    referencedTableName: vehicle
                    referencedTableSchemaName: trips_cargo
              - column:
                  name: start_date
                  type: timestamp
                  remarks: Время начала смены
              - column:
                  name: end_date
                  type: timestamp
                  remarks: Время окончания смены
              - column:
                  name: deleted
                  type: boolean
                  remarks: Признак удаленности
              - column:
                  name: active
                  type: boolean
                  remarks: Признак активности
      rollback:
        - dropTable:
            schemaName: trips_cargo
            tableName: shift
  - changeSet:
      id: "20231003-1"
      author: blandin-ad
      changes:
        - addColumn:
            schemaName: trips_cargo
            tableName: trips
            columns:
              - column:
                  name: dispatcher_id
                  type: uuid
                  remarks: Идентификатор диспетчера
              - column:
                  name: arrived_date
                  type: timestamp
                  remarks: Время прибытия
      rollback:
        - dropColumn:
            schemaName: trips_cargo
            tableName: trips
            columns:
              - column:
                  name: dispatcher_id
              - column:
                  name: arrived_date