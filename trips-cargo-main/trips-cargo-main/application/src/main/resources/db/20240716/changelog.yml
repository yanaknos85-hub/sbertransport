databaseChangeLog:
  - changeSet:
      id: "20240716"
      author: smirnova
      changes:
        - addColumn:
            schemaName: trips_cargo
            tableName: trip_history
            columns:
              - column:
                  name: old_driver_id
                  type: uuid
                  remarks: Старый водитель
              - column:
                  name: new_driver_id
                  type: uuid
                  remarks: Новый водитель
              - column:
                  name: old_status
                  type: varchar(32)
                  remarks: Старый статус
              - column:
                  name: new_status
                  type: varchar(32)
                  remarks: Новый статус
              - column:
                  name: actor_id
                  type: uuid
                  remarks: ID инициатора
              - column:
                  name: actor_type
                  type: varchar(16)
                  remarks: Тип инициатора
              - column:
                  name: action
                  type: varchar(32)
                  remarks: Действие
        - addColumn:
            schemaName: trips_cargo
            tableName: trips
            columns:
              - column:
                  name: planned_shift_id
                  type: uuid
                  remarks: Идентификатор смены, во время которой планируется исполнение поездки
        - addForeignKeyConstraint:
            baseTableSchemaName: trips_cargo
            baseTableName: trips
            baseColumnNames: planned_shift_id
            referencedTableSchemaName: trips_cargo
            referencedTableName: shift
            referencedColumnNames: id
            constraintName: trips_trips_planned_shift_id_fk
        - addColumn:
            schemaName: trips_cargo
            tableName: trip_history
            columns:
              - column:
                  name: new_planned_shift_id
                  type: uuid
                  remarks: Новый идентификатор смены, во время которой планируется исполнение поездки
        - addForeignKeyConstraint:
            baseTableSchemaName: trips_cargo
            baseTableName: trip_history
            baseColumnNames: new_planned_shift_id
            referencedTableSchemaName: trips_cargo
            referencedTableName: shift
            referencedColumnNames: id
            constraintName: trips_trip_history_new_planned_shift_id_fk
        - addColumn:
            schemaName: trips_cargo
            tableName: trip_history
            columns:
              - column:
                  name: old_planned_shift_id
                  type: uuid
                  remarks: Старый идентификатор смены, во время которой планировалось исполнение поездки
        - addForeignKeyConstraint:
            baseTableSchemaName: trips_cargo
            baseTableName: trip_history
            baseColumnNames: old_planned_shift_id
            referencedTableSchemaName: trips_cargo
            referencedTableName: shift
            referencedColumnNames: id
            constraintName: trips_trip_history_old_planned_shift_id_fk
      rollback:
        - dropColumn:
            schemaName: trips_cargo
            tableName: trips
            columns:
              - column:
                  name: planned_shift_id
        - dropColumn:
            schemaName: trips_cargo
            tableName: trip_history
            columns:
              - column:
                  name: new_planned_shift_id
              - column:
                  name: old_driver_id
              - column:
                  name: new_driver_id
              - column:
                  name: old_status
              - column:
                  name: new_status
              - column:
                  name: actor_id
              - column:
                  name: actor_type
              - column:
                  name: action
