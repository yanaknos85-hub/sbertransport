branch:
  ignore_regex: "^master$|^release/.*$|^hotfix/.*$" #регулярное выражение для игнорирования пр-ов из ветки такой-то

review_mode: # режим ревью: можно выбрать либо использовать одновременно
  - DETAILED # пофайловый анализ кода (производительность, безопасность, читаемость, отказоустойчивость и др.)
  - FIRST_VIEW # общий анализ архитектуры и логической согласованности
  - CUSTOM # анализ по пользовательским инструкциям (файл customer_instructions_file_name)

review_format: # задаёт, в каком виде будут представлены результаты (можно выбрать несколько):
  - SUGGESTIONS # инлайн-предложения прямо в коде
  - REPORT # единый текстовый отчёт
  #- HTML # подробный HTML-отчёт с описанием проблем и исправлений

customer_instructions_file_name: "instructions.md" # имя файла с инструкциями

