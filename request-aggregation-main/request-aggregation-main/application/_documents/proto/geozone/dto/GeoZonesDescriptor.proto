syntax = "proto3";

package ru.sber.transport.geo_zones.grpc.dto;

import "google/protobuf/struct.proto";

message Waypoint {
  string country = 1;
  string region = 2;
  string city = 3;
  string street = 4;
  string house = 5;
  NullableString building = 6;
  NullableString structure = 7;
  NullableString district = 8;
}

message Region {
  string id = 1;
  string code = 2;
  string name = 3;
  NullableString parentId = 4;
  string timeZone = 5;
}

message NullableString {
  oneof kind {
    google.protobuf.NullValue null = 1;
    string data = 2;
  }
}