      author: novikova-km
      dbms: postgresql
      changes:
        - addColumn:
            schemaName: request_aggregation
            tableName: lead
            columns:
              - column:
                  name: status
                  type: request_aggregation.type_lead_status
                  remarks: Статус пользовательской заявки
                  defaultValue: 'PROCESSING'
                  constraints:
                    - nullable: false
              - column:
                  name: transport_type
                  type: request_aggregation.type_transport_type
                  remarks: Тип транспорта
                  defaultValue: 'TAXI'
                  constraints:
                    - nullable: false
              - column:
                  name: trip_type
                  type: request_aggregation.type_trip_type
                  defaultValue: 'DAYTIME_TRIP'
                  remarks: Цель поездки
                  constraints:
                    - nullable: false

